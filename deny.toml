# cargo-deny supply-chain policy -- `cargo deny check`
[advisories]
yanked = "deny"
ignore = ["RUSTSEC-2024-0436"]  # paste: unmaintained, not vulnerable, no upgrade

[bans]
multiple-versions = "allow"     # small crates; transitive dupes are not worth a red X
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0",
         "CC0-1.0", "0BSD", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
